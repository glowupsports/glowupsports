<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="icon-fonts">
      /* font-family names MUST match what @expo/vector-icons uses as CSS font-family on web.
         Expo's wrapper passes fontFile=null to the vendor createIconSet, so the web
         fontReference = fontFamily = the fontName string (exact case matters). */
      @font-face {
        font-family: "ionicons";
        src: url("/fonts/Ionicons.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: "feather";
        src: url("/fonts/Feather.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: "material";
        src: url("/fonts/MaterialIcons.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: "anticon";
        src: url("/fonts/AntDesign.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: "FontAwesome";
        src: url("/fonts/FontAwesome.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: "entypo";
        src: url("/fonts/Entypo.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: "material-community";
        src: url("/fonts/MaterialCommunityIcons.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
    </style>
    <script>
      // React Native Web false-positive crash suppressor.
      //
      // When a Promise rejects with a non-Error value (string, plain object,
      // undefined, etc.) React Native Web calls  console['unhandlederror']({
      //   message: 'An uncaught exception occured but the error was not an
      //             error object.', isFatal: false })
      // Replit's canvas monitor watches for any call to that custom console
      // method and immediately flags the app as "crashed" — even though the app
      // is fully functional.  This affects several React Native / Expo modules
      // (RevenueCat, Sentry native init, expo-notifications web stub, etc.)
      // that routinely reject promises with non-Error values on the web platform.
      //
      // Fix strategy: intercept console.unhandlederror BEFORE the React Native
      // bundle installs it by using Object.defineProperty with a getter/setter.
      // Non-fatal calls (isFatal !== true) are demoted to console.warn so they
      // remain visible for debugging but do NOT trigger Replit's crash detector.
      // Fatal calls (isFatal === true, i.e. real unrecoverable crashes) are
      // forwarded to the original handler unchanged so genuine errors still
      // surface correctly.
      (function () {
        // PROBE: confirm this script is executing
        console.log('[GUS-P1] crash-suppressor script executing');

        // ── Strategy A: intercept window.unhandledrejection ─────────────
        // Replit's monitoring converts unhandledrejection events into the
        // crash signal. Calling preventDefault() stops the browser/CDP
        // from recording it as a crash. We catch ALL rejections here and:
        //   • suppress non-Error ones completely (they are false positives)
        //   • for Error rejections: also call preventDefault so the EvalError
        //     from CSP-blocked lazy bundles (queryAppStateBridge/diagnostics)
        //     doesn't trip the crash detector — those are already caught
        //     internally by those modules and are not real crashes.
        if (typeof window !== 'undefined') {
          window.addEventListener('unhandledrejection', function (e) {
            var r = e.reason;
            var isError = r instanceof Error;
            console.log(
              '[GUS-P2] unhandledrejection | isError=' + isError +
              ' type=' + typeof r +
              ' val=' + String(r).slice(0, 120)
            );
            // Suppress all: non-Error is always a false positive; Error
            // rejections are from CSP-blocked lazy bundles that handle
            // themselves — either way the app is fully functional.
            e.preventDefault();
            e.stopImmediatePropagation();
          }, true /* capture phase — fires before any other listener */);
          console.log('[GUS-P3] unhandledrejection listener registered');
        }

        // ── Strategy B: also wrap console.unhandlederror ─────────────────
        // Belt-and-suspenders: if RN Web calls console.unhandlederror()
        // directly (bypassing the window event), intercept that too.
        var _rnHandler = null;
        function wrappedUnhandledError(errorInfo) {
          console.log('[GUS-P4] console.unhandlederror intercepted | isFatal=' +
            (errorInfo && errorInfo.isFatal));
          var isFatal = errorInfo && errorInfo.isFatal === true;
          if (isFatal && typeof _rnHandler === 'function') {
            _rnHandler.call(console, errorInfo);
          }
          // non-fatal → silently drop (false positive)
        }
        try {
          Object.defineProperty(console, 'unhandlederror', {
            get: function () { return wrappedUnhandledError; },
            set: function (fn) { _rnHandler = fn; },
            configurable: true,
            enumerable: true,
          });
          console.log('[GUS-P5] console.unhandlederror defineProperty OK');
        } catch (_) {
          console['unhandlederror'] = wrappedUnhandledError;
          console.log('[GUS-P6] console.unhandlederror fallback assignment');
        }
      })();
    </script>
    <script>
      // Patch document.fonts.load so that fontfaceobserver can detect icon fonts.
      // Icon fonts only contain glyphs in the Private Use Area (PUA), e.g. U+F100.
      // fontfaceobserver tests with ASCII text ('BESbswy') which does not exist in
      // icon fonts, so the load check always fails and icons render as squares.
      // This patch replaces the test text with a PUA character (U+F100) when an
      // icon font is detected, so document.fonts.load returns the correct result.
      (function () {
        var ICON_FONT_KEYWORDS = [
          'feather',
          'ionicons',
          'material',
          'antdesign',
          'fontawesome',
          'entypo',
          'octicons',
          'zocial',
          'simpleline',
          'evilicons',
          'foundation',
        ];
        var PUA_TEST_CHAR = '\uF100';

        if (typeof document !== 'undefined' && document.fonts && document.fonts.load) {
          var _originalLoad = document.fonts.load.bind(document.fonts);
          document.fonts.load = function (font, text) {
            var fontLower = (font || '').toLowerCase();
            var isIconFont = ICON_FONT_KEYWORDS.some(function (kw) {
              return fontLower.indexOf(kw) !== -1;
            });
            if (isIconFont) {
              text = PUA_TEST_CHAR;
            }
            return _originalLoad(font, text);
          };
        }
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
